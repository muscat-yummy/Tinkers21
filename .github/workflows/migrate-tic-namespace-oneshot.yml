name: Port read only modifier component queries and inspect native arrow item APIs
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/migrate-tic-namespace-oneshot.yml]
permissions:
  contents: write
jobs:
  inspect_native_next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/1.21.1-neoforge
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve exact native API classpath
        run: |
          cat > /tmp/native-api.init.gradle <<'GRADLE'
          gradle.projectsEvaluated {
              rootProject.tasks.register('nativeApiClasspath') {
                  doLast {
                      new File('/tmp/native-api-classpath.txt').text = rootProject.configurations.compileClasspath.files.collect { it.absolutePath }.join('\n')
                  }
              }
          }
          GRADLE
          ./gradlew :createMinecraftArtifacts :nativeApiClasspath --no-daemon --console=plain -I /tmp/native-api.init.gradle
      - name: Inspect public tooltip and loot implementation APIs
        shell: python
        run: |
          import pathlib, subprocess, zipfile
          targets = {
              'net.neoforged.neoforge.event.level.BlockDropsEvent': ['public '],
              'net.minecraft.core.dispenser.BlockSource': ['public '],
              'net.minecraft.world.item.ArrowItem': None,
              'net.neoforged.neoforge.common.extensions.IArrowItemExtension': ['public '],
              'net.minecraft.world.item.enchantment.EnchantmentEffectComponents': ['public '],
              'net.minecraft.world.item.enchantment.Enchantments': ['public '],
              'net.minecraft.world.entity.projectile.AbstractHurtingProjectile': None,
              'net.minecraft.world.entity.projectile.AbstractArrow': None,
              'net.minecraft.world.entity.projectile.ThrownTrident': None,
              'net.minecraft.world.item.crafting.CraftingInput': None,
              'net.minecraft.world.item.crafting.CraftingInput$Positioned': ['public '],
              'net.minecraft.world.inventory.CraftingContainer': None,
              'net.neoforged.neoforge.common.CommonHooks': ['CraftingPlayer('],
              'net.minecraft.client.renderer.LevelRenderer': ['renderLineBox(', 'renderShape('],
              'net.minecraft.client.renderer.blockentity.BlockEntityRenderer': ['public '],
              'net.neoforged.neoforge.client.extensions.IBlockEntityRendererExtension': ['public '],
              'net.minecraft.world.phys.AABB': ['public '],
              'net.minecraft.nbt.NbtUtils': ['readBlockPos(', 'writeBlockPos('],
              'net.neoforged.neoforge.fluids.capability.templates.FluidTank': ['readFromNBT(', 'writeToNBT('],
              'net.minecraft.world.item.crafting.RecipeManager': ['public '],
              'net.minecraft.world.item.crafting.RecipeHolder': ['public '],
              'net.minecraft.world.item.component.CustomData': ['public '],
              'net.minecraft.world.item.Item$TooltipContext': ['public '],
              'net.minecraft.network.syncher.SynchedEntityData$Builder': ['public '],
              'net.neoforged.neoforge.common.loot.LootModifier': ['public ', 'protected '],
              'net.neoforged.neoforge.common.loot.IGlobalLootModifier': ['public '],
              'net.minecraft.world.level.storage.loot.parameters.LootContextParams': ['public '],
              'net.minecraft.world.level.block.LiquidBlock': ['public ', 'protected '],
              'net.minecraft.world.entity.Entity': ['igniteForSeconds(', 'getFluidTypeHeight('],
              'net.minecraft.world.item.Item': ['BASE_ATTACK', 'getDefaultAttributeModifiers(', 'verifyComponentsAfterLoad(', 'appendHoverText('],
              'net.minecraft.world.item.component.ItemAttributeModifiers': ['public '],
              'net.minecraft.world.item.component.ItemAttributeModifiers$Builder': ['public '],
              'net.neoforged.fml.ModLoader': ['public '],
              'net.neoforged.neoforge.event.AddReloadListenerEvent': ['public '],
              'net.minecraft.advancements.critereon.EntityPredicate': ['public '],
              'net.minecraft.advancements.critereon.EntityPredicate$Builder': ['public '],
              'net.minecraft.advancements.critereon.ItemCustomDataPredicate': ['public '],
              'net.minecraft.advancements.critereon.ItemSubPredicates': ['public '],
              'net.minecraft.world.entity.SpawnPlacementTypes': ['public '],
              'net.minecraft.world.level.block.ComposterBlock': ['COMPOSTABLES', 'add('],
              'net.minecraft.world.entity.EntityType': ['create('],
              'net.minecraft.advancements.critereon.PlayerTrigger$TriggerInstance': ['public '],
              'net.minecraft.advancements.critereon.PlayerInteractTrigger$TriggerInstance': ['public '],
              'net.minecraft.advancements.critereon.ItemPredicate$Builder': ['public '],
              'net.minecraft.advancements.critereon.EntityEquipmentPredicate$Builder': ['public '],
              'net.minecraft.advancements.critereon.LocationPredicate$Builder': ['public '],
              'com.mojang.blaze3d.vertex.VertexConsumer': None,
              'net.minecraft.network.syncher.EntityDataSerializer': ['public '],
              'net.minecraft.network.codec.StreamCodec': ['public '],
              'net.minecraft.world.entity.LivingEntity': ['onEffectRemoved(', 'onEffectAdded(', 'getAttributeValue(', 'jumpFromGround(', 'isSuppressingSlidingDownLadder('],
              'net.minecraft.world.food.FoodProperties$Builder': ['public '],
              'net.minecraft.world.food.FoodProperties': ['public '],
              'net.minecraft.world.effect.MobEffects': ['public '],
              'net.minecraft.world.level.storage.loot.entries.LootPoolEntries': ['public '],
              'net.minecraft.world.effect.MobEffect': ['public ', 'protected '],
              'net.minecraft.world.entity.ai.attributes.Attributes': ['public '],
              'net.minecraft.world.entity.ai.attributes.AttributeModifier$Operation': ['public '],
              'net.minecraft.world.entity.ai.attributes.AttributeInstance': ['public '],
              'net.minecraft.world.item.alchemy.PotionBrewing$Builder': ['public '],
              'net.minecraft.world.item.alchemy.PotionBrewing': ['public '],
              'net.minecraft.world.item.ItemStack': ['addToTooltip(', 'getTooltipLines(', 'getEnchantments(', 'getComponentsPatch(', 'isSameItemSameComponents('],
              'net.minecraft.world.item.enchantment.ItemEnchantments': ['public '],
              'net.minecraft.world.item.enchantment.Enchantment': ['getSlotItems(', 'matchingSlot(', 'definition('],
              'net.minecraft.world.level.storage.loot.LootContext': ['getParam(', 'getParamOrNull(', 'hasParam('],
              'net.minecraft.world.level.storage.loot.functions.EnchantedCountIncreaseFunction': None,
              'net.minecraft.world.level.storage.loot.predicates.LootItemRandomChanceWithEnchantedBonusCondition': None,
              'net.minecraft.world.item.enchantment.EnchantmentHelper': None
          }
          for entry in pathlib.Path('/tmp/native-api-classpath.txt').read_text().splitlines():
              jar = pathlib.Path(entry)
              if not jar.is_file() or jar.suffix != '.jar':
                  continue
              with zipfile.ZipFile(jar) as archive:
                  names = set(archive.namelist())
              for cls, wanted in list(targets.items()):
                  if cls.replace('.', '/') + '.class' not in names:
                      continue
                  command = ['javap', '-classpath', str(jar), '-p']
                  if wanted is None:
                      command.append('-c')
                  command.append(cls)
                  result = subprocess.run(command, capture_output=True, text=True, check=True)
                  print('Native tooltip/loot API:', cls)
                  for line in result.stdout.splitlines():
                      if wanted is None or any(token in line for token in wanted):
                          print(line)
                  del targets[cls]
          if targets:
              raise RuntimeError('API classes not found: ' + ', '.join(targets))

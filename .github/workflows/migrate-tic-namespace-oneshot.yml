              raise RuntimeError('API classes not found: ' + ', '.join(targets))
      - name: Migrate references to classes present in NeoForge
        run: |
          python3 scripts/port/migrate_tic_namespace.py
          python3 scripts/port/migrate_tic_resource_locations.py
          python3 scripts/port/migrate_tic_fluid_copies.py
          python3 scripts/port/migrate_tic_wrapped_ingredients.py
          python3 scripts/port/migrate_tic_access_transformer.py
          python3 scripts/port/migrate_tic_attribute_operations.py
          python3 scripts/port/migrate_tic_finished_recipe_ids.py
          python3 scripts/port/migrate_tic_recipe_result_lookup.py
          python3 scripts/port/migrate_tic_common_tags.py
      - name: Verify migration idempotence before persisting source
        shell: python
        run: |
          import hashlib, pathlib, subprocess
          paths = sorted(pathlib.Path('src/main/java').rglob('*.java'))
          paths.append(pathlib.Path('src/main/resources/META-INF/accesstransformer.cfg'))
          before = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          for script in ('migrate_tic_namespace.py', 'migrate_tic_resource_locations.py', 'migrate_tic_fluid_copies.py', 'migrate_tic_wrapped_ingredients.py', 'migrate_tic_access_transformer.py', 'migrate_tic_attribute_operations.py', 'migrate_tic_finished_recipe_ids.py', 'migrate_tic_recipe_result_lookup.py', 'migrate_tic_common_tags.py'):
              subprocess.run(['python3', 'scripts/port/' + script], check=True)
          changed = [str(p) for p in paths if before[str(p)] != hashlib.sha256(p.read_bytes()).hexdigest()]
          if changed:
              raise RuntimeError('Migration changed files on second pass: ' + ', '.join(changed))
          print('Namespace/resource/access migration idempotence: PASS')
      - name: Persist the migration on the authorized port branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java src/main/resources/META-INF/accesstransformer.cfg
          if ! git diff --cached --quiet; then
            git commit -m "Port TiC references to resolved NeoForge 1.21.1 classes"
            persisted=false
            for attempt in 1 2 3; do
              git fetch origin port/1.21.1-neoforge
              # Rebase only the generated source commit; never overwrite concurrent port work.
              git rebase origin/port/1.21.1-neoforge
              if git push origin HEAD:port/1.21.1-neoforge; then
                persisted=true
                break
              fi
            done
            if [ "$persisted" != true ]; then
              echo "Concurrent updates prevented migration persistence after three attempts"
              exit 1
            fi
          fi

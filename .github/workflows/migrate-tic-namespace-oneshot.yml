name: Port native solid and multiblock fuel capability lookups
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/migrate-tic-namespace-oneshot.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/1.21.1-neoforge
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve the exact compile classpath
        run: |
          cat > /tmp/tinkers-compiler.init.gradle <<'GRADLE'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.compilerArgs.addAll(['-Xmaxerrs', '12000'])
              }
          }
          gradle.projectsEvaluated {
              rootProject.tasks.register('compileResourceIdSmoke', JavaCompile) {
                  source = rootProject.files('src/main/java/slimeknights/tconstruct/library/utils/ResourceId.java', 'src/portTest/java/slimeknights/tconstruct/port/ResourceIdSmoke.java')
                  classpath = rootProject.configurations.compileClasspath
                  destinationDirectory.set(rootProject.layout.buildDirectory.dir('port-test/resource-id'))
              }
              rootProject.tasks.register('runResourceIdSmoke', JavaExec) {
                  dependsOn 'compileResourceIdSmoke'
                  classpath = rootProject.files(rootProject.layout.buildDirectory.dir('port-test/resource-id')) + rootProject.configurations.compileClasspath
                  mainClass.set('slimeknights.tconstruct.port.ResourceIdSmoke')
              }
              rootProject.tasks.register('compileLeafPortChecks', JavaCompile) {
                  dependsOn ':mantle-port:compileJava'
                  source = rootProject.files('src/main/java/slimeknights/tconstruct/library/utils/BlockCapabilitySource.java', 'src/main/java/slimeknights/tconstruct/shared/particle/FluidParticleData.java', 'src/main/java/slimeknights/tconstruct/shared/inventory/BlockContainerOpenedTrigger.java', 'src/main/java/slimeknights/tconstruct/common/json/BlockOrEntityCondition.java', 'src/main/java/slimeknights/tconstruct/library/json/loot/HasLootContextSetCondition.java', 'src/portTest/java/slimeknights/tconstruct/port/LootConditionSmoke.java', 'src/main/java/slimeknights/tconstruct/library/json/condition/TagIntersectionPresentCondition.java', 'src/main/java/slimeknights/tconstruct/library/json/condition/TagDifferencePresentCondition.java', 'src/main/java/slimeknights/tconstruct/library/json/condition/TagNotEmptyCondition.java', 'src/portTest/java/slimeknights/tconstruct/port/TagConditionSmoke.java', 'src/main/java/slimeknights/tconstruct/library/json/loot/TagPreferenceLootEntry.java', 'src/main/java/slimeknights/tconstruct/library/recipe/ingredient/BlockTagIngredient.java', 'src/main/java/slimeknights/tconstruct/library/recipe/ingredient/NoContainerIngredient.java', 'src/main/java/slimeknights/tconstruct/library/fluid/StoredFluid.java', 'src/main/java/slimeknights/tconstruct/library/fluid/FluidItemData.java', 'src/main/java/slimeknights/tconstruct/smeltery/item/ScaledFluidTank.java', 'src/main/java/slimeknights/tconstruct/library/utils/TagUtil.java', 'src/main/java/slimeknights/tconstruct/fluids/util/ConstantFluidContainerWrapper.java', 'src/portTest/java/slimeknights/tconstruct/port/FluidContentsSmoke.java', 'src/main/java/slimeknights/tconstruct/library/recipe/ingredient/InstrumentIngredient.java', 'src/portTest/java/slimeknights/tconstruct/port/InstrumentIngredientSmoke.java', 'src/portTest/java/slimeknights/tconstruct/port/LoadableIngredientScopeSmoke.java', 'src/portTest/java/net/neoforged/neoforge/registries/VanillaRegistryPortTestBootstrap.java', 'src/main/java/slimeknights/tconstruct/tools/modifiers/loot/BonusFormulaCodec.java', 'src/portTest/java/slimeknights/tconstruct/port/BonusFormulaSmoke.java')
                  options.annotationProcessorPath = rootProject.configurations.annotationProcessor
                  classpath = rootProject.sourceSets.main.compileClasspath
                  destinationDirectory.set(rootProject.layout.buildDirectory.dir('port-test/leaf'))
              }
              rootProject.tasks.register('runLootConditionSmoke', JavaExec) {
                  dependsOn 'compileLeafPortChecks'
                  classpath = rootProject.files(rootProject.layout.buildDirectory.dir('port-test/leaf')) + rootProject.sourceSets.main.compileClasspath + rootProject.configurations.runtimeClasspath
                  mainClass.set('slimeknights.tconstruct.port.LootConditionSmoke')
              }
              rootProject.tasks.register('runTagConditionSmoke', JavaExec) {
                  dependsOn 'compileLeafPortChecks'
                  classpath = rootProject.files(rootProject.layout.buildDirectory.dir('port-test/leaf')) + rootProject.sourceSets.main.compileClasspath + rootProject.configurations.runtimeClasspath
                  mainClass.set('slimeknights.tconstruct.port.TagConditionSmoke')
              }
              rootProject.tasks.register('runFluidContentsSmoke', JavaExec) {
                  dependsOn 'compileLeafPortChecks'
                  classpath = rootProject.files(rootProject.layout.buildDirectory.dir('port-test/leaf')) + rootProject.sourceSets.main.compileClasspath + rootProject.configurations.runtimeClasspath
                  mainClass.set('slimeknights.tconstruct.port.FluidContentsSmoke')
              }
              rootProject.tasks.register('runInstrumentIngredientSmoke', JavaExec) {
                  dependsOn 'compileLeafPortChecks'
                  classpath = rootProject.files(rootProject.layout.buildDirectory.dir('port-test/leaf')) + rootProject.sourceSets.main.compileClasspath + rootProject.configurations.runtimeClasspath
                  mainClass.set('slimeknights.tconstruct.port.InstrumentIngredientSmoke')
              }
              rootProject.tasks.register('runLoadableIngredientScopeSmoke', JavaExec) {
                  dependsOn 'compileLeafPortChecks'
                  classpath = rootProject.files(rootProject.layout.buildDirectory.dir('port-test/leaf')) + rootProject.sourceSets.main.compileClasspath + rootProject.configurations.runtimeClasspath
                  mainClass.set('slimeknights.tconstruct.port.LoadableIngredientScopeSmoke')
              }
              rootProject.tasks.register('runBonusFormulaSmoke', JavaExec) {
                  dependsOn 'compileLeafPortChecks'
                  classpath = rootProject.files(rootProject.layout.buildDirectory.dir('port-test/leaf')) + rootProject.sourceSets.main.compileClasspath + rootProject.configurations.runtimeClasspath
                  mainClass.set('slimeknights.tconstruct.port.BonusFormulaSmoke')
              }
              rootProject.tasks.register('compileArmorRegistryCheck', JavaCompile) {
                  dependsOn ':mantle-port:compileJava'
                  source = rootProject.files('src/main/java/slimeknights/tconstruct/library/tools/item/armor/DummyArmorMaterial.java', 'src/portTest/java/net/neoforged/neoforge/registries/ArmorMaterialRegistrationSmoke.java')
                  options.annotationProcessorPath = rootProject.configurations.annotationProcessor
                  classpath = rootProject.sourceSets.main.compileClasspath
                  destinationDirectory.set(rootProject.layout.buildDirectory.dir('port-test/armor-registry'))
              }
              rootProject.tasks.register('runArmorRegistryCheck', JavaExec) {
                  dependsOn 'compileArmorRegistryCheck'
                  classpath = rootProject.files(rootProject.layout.buildDirectory.dir('port-test/armor-registry')) + rootProject.sourceSets.main.compileClasspath + rootProject.configurations.runtimeClasspath
                  mainClass.set('net.neoforged.neoforge.registries.ArmorMaterialRegistrationSmoke')
              }
              rootProject.tasks.register('compileTiCDeclarations', JavaCompile) {
                  dependsOn ':mantle-port:compileJava'
                  source = rootProject.sourceSets.main.allJava
                  classpath = rootProject.sourceSets.main.compileClasspath
                  options.annotationProcessorPath = rootProject.configurations.annotationProcessor
                  options.compilerArgs.add('-proc:only')
                  destinationDirectory.set(rootProject.layout.buildDirectory.dir('port-test/declarations'))
              }
              rootProject.tasks.register('portClasspath') {
                  doLast {
                      new File('/tmp/tinkers-port-classpath.txt').text = rootProject.configurations.compileClasspath.files.collect { it.absolutePath }.join('\n')
                  }
              }
          }
          GRADLE
          ./gradlew :createMinecraftArtifacts :portClasspath --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle
      - name: Inspect public APIs needed by the next port step
        shell: python
        run: |
          import pathlib, subprocess, zipfile
          targets = {
              'net.minecraft.world.level.storage.loot.functions.ApplyBonusCount': ('class ', 'CODEC', 'FORMULA',),
              'net.minecraft.world.level.storage.loot.functions.ApplyBonusCount$Formula': ('interface ', 'CODEC', 'getType(',),
              'net.minecraft.world.level.storage.loot.functions.ApplyBonusCount$FormulaType': ('class ', 'record ', 'Codec',),
              'net.minecraft.world.level.storage.loot.functions.LootItemConditionalFunction': ('class ', 'commonFields(', 'LootItemConditionalFunction(',),
              'net.minecraft.world.level.storage.loot.entries.LootPoolSingletonContainer': ('class ', 'singletonFields(', 'LootPoolSingletonContainer(',),
          
              'net.minecraft.world.item.alchemy.PotionBrewing$Builder': ('addMix(', 'addRecipe('),
              'net.minecraft.resources.ResourceLocation': ('class ', 'ResourceLocation(java.lang.String, java.lang.String)',),
              'net.minecraft.core.particles.ParticleType': ('ParticleType(', 'codec(', 'streamCodec(',),
              'net.minecraft.world.level.block.TransparentBlock': ('class ', 'TransparentBlock(',),
              'net.minecraft.world.item.component.DyedItemColor': ('DyedItemColor(', 'rgb(', 'getColor(',),
              'net.minecraft.world.item.BlockItem': ('updateCustomBlockEntityTag(',),
              'net.minecraft.world.item.ArmorMaterial': ('ArmorMaterial(',),
              'net.minecraft.world.item.ArmorMaterial$Layer': ('Layer(',),
              'net.minecraft.world.item.ArmorItem': ('ArmorItem(', 'getMaterial(',),
              'net.neoforged.neoforge.registries.DeferredRegister': ('create(', 'register(',),
              'net.minecraft.world.item.enchantment.Enchantment$EnchantmentDefinition': ('EnchantmentDefinition(', 'slots(',),
              'net.minecraft.core.registries.BuiltInRegistries': ('Registry<',),
              'net.neoforged.neoforge.registries.NeoForgeRegistries': ('Registry<',),
          }
          for entry in pathlib.Path('/tmp/tinkers-port-classpath.txt').read_text().splitlines():
              jar = pathlib.Path(entry)
              if not jar.is_file() or jar.suffix != '.jar':
                  continue
              with zipfile.ZipFile(jar) as archive:
                  names = set(archive.namelist())
              for cls, wanted in list(targets.items()):
                  if cls.replace('.', '/') + '.class' not in names:
                      continue
                  result = subprocess.run(['javap', '-classpath', str(jar), '-p', cls], capture_output=True, text=True, check=True)
                  print('Public API:', cls)
                  for line in result.stdout.splitlines():
                      if any(token in line for token in wanted):
                          print(line)
                  del targets[cls]
          if targets:
              raise RuntimeError('API classes not found: ' + ', '.join(targets))
      - name: Migrate references to classes present in NeoForge
        run: |
          python3 scripts/port/migrate_tic_namespace.py
          python3 scripts/port/migrate_tic_resource_locations.py
          python3 scripts/port/migrate_tic_fluid_copies.py
          python3 scripts/port/migrate_tic_wrapped_ingredients.py
          python3 scripts/port/migrate_tic_access_transformer.py
      - name: Verify migration idempotence before persisting source
        shell: python
        run: |
          import hashlib, pathlib, subprocess
          paths = sorted(pathlib.Path('src/main/java').rglob('*.java'))
          paths.append(pathlib.Path('src/main/resources/META-INF/accesstransformer.cfg'))
          before = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          for script in ('migrate_tic_namespace.py', 'migrate_tic_resource_locations.py', 'migrate_tic_fluid_copies.py', 'migrate_tic_wrapped_ingredients.py', 'migrate_tic_access_transformer.py'):
              subprocess.run(['python3', 'scripts/port/' + script], check=True)
          changed = [str(p) for p in paths if before[str(p)] != hashlib.sha256(p.read_bytes()).hexdigest()]
          if changed:
              raise RuntimeError('Migration changed files on second pass: ' + ', '.join(changed))
          print('Namespace/resource/access migration idempotence: PASS')
      - name: Persist the migration on the authorized port branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java src/main/resources/META-INF/accesstransformer.cfg
          if ! git diff --cached --quiet; then
            git commit -m "Port TiC references to resolved NeoForge 1.21.1 classes"
            git push origin HEAD:port/1.21.1-neoforge
          fi
      - name: Apply verified mapped access changes to Minecraft artifacts
        run: ./gradlew :createMinecraftArtifacts --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle
      - name: Compile Mantle
        run: ./gradlew :mantle-port:compileJava --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle
      - name: Verify typed resource ID behavior independently of the remaining TiC port
        run: ./gradlew :runResourceIdSmoke --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle
      - name: Compile particle and criterion implementations independently
        continue-on-error: true
        run: ./gradlew :compileLeafPortChecks --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle
      - name: Verify loot condition JSON and invalid-set behavior
        continue-on-error: true
        run: ./gradlew :runLootConditionSmoke --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle
      - name: Verify tag condition behavior and legacy JSON fields
        continue-on-error: true
        run: ./gradlew :runTagConditionSmoke --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle
      - name: Verify fluid components and scaled container behavior
        continue-on-error: true
        run: ./gradlew :runFluidContentsSmoke --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle
      - name: Verify instrument component matching and native codecs
        continue-on-error: true
        run: ./gradlew :runInstrumentIngredientSmoke --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle
      - name: Verify loadable ingredient registry operations and nested serialization
        continue-on-error: true
        run: ./gradlew :runLoadableIngredientScopeSmoke --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle
      - name: Verify native bonus formula JSON and deterministic drop counts
        continue-on-error: true
        run: ./gradlew :runBonusFormulaSmoke --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle
      - name: Verify native armor registration and deferred equip sound
        continue-on-error: true
        run: ./gradlew :runArmorRegistryCheck --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle
      - name: Diagnose TiC declarations independently of method bodies
        continue-on-error: true
        run: ./gradlew :compileTiCDeclarations --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle
      - name: Compile Tinkers
        run: ./gradlew :compileJava --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle

name: Migrate TiC bootstrap bus and enum extensions
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/migrate-tic-namespace-oneshot.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/1.21.1-neoforge
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve the exact compile classpath
        run: |
          cat > /tmp/tinkers-compiler.init.gradle <<'GRADLE'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.compilerArgs.addAll(['-Xmaxerrs', '4000'])
              }
          }
          gradle.projectsEvaluated {
              rootProject.tasks.register('portClasspath') {
                  doLast {
                      new File('/tmp/tinkers-port-classpath.txt').text = rootProject.configurations.compileClasspath.files.collect { it.absolutePath }.join('\n')
                  }
              }
          }
          GRADLE
          ./gradlew :createMinecraftArtifacts :portClasspath --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle
      - name: Inspect public APIs needed by the next port step
        shell: python
        run: |
          import pathlib, subprocess, zipfile
          targets = {
              'net.minecraft.world.item.alchemy.PotionBrewing$Builder': ('addMix(', 'addRecipe('),
              'net.minecraft.world.item.ArmorMaterial': ('ArmorMaterial(',),
              'net.minecraft.world.item.enchantment.Enchantment$EnchantmentDefinition': ('EnchantmentDefinition(', 'slots(',),
              'net.minecraft.core.registries.BuiltInRegistries': ('Registry<',),
              'net.neoforged.neoforge.registries.NeoForgeRegistries': ('Registry<',),
          }
          for entry in pathlib.Path('/tmp/tinkers-port-classpath.txt').read_text().splitlines():
              jar = pathlib.Path(entry)
              if not jar.is_file() or jar.suffix != '.jar':
                  continue
              with zipfile.ZipFile(jar) as archive:
                  names = set(archive.namelist())
              for cls, wanted in list(targets.items()):
                  if cls.replace('.', '/') + '.class' not in names:
                      continue
                  result = subprocess.run(['javap', '-classpath', str(jar), '-p', cls], capture_output=True, text=True, check=True)
                  print('Public API:', cls)
                  for line in result.stdout.splitlines():
                      if any(token in line for token in wanted):
                          print(line)
                  del targets[cls]
          if targets:
              raise RuntimeError('API classes not found: ' + ', '.join(targets))
      - name: Migrate references to classes present in NeoForge
        run: python3 scripts/port/migrate_tic_namespace.py
      - name: Persist the migration on the authorized port branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          if ! git diff --cached --quiet; then
            git commit -m "Port TiC references to resolved NeoForge 1.21.1 classes"
            git push origin HEAD:port/1.21.1-neoforge
          fi
      - name: Compile Mantle
        run: ./gradlew :mantle-port:compileJava --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle
      - name: Compile Tinkers
        run: ./gradlew :compileJava --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle

name: Migrate verified NeoForge source imports
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/migrate-exact-imports-oneshot.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact source-tree import moves
        run: |
          set -euo pipefail
          python3 scripts/migrate_verified_imports.py --root mantle-port
          python3 scripts/migrate_verified_imports.py --root tconstruct
          git add mantle-port/src/main/java src/main/java
          if ! git diff --cached --quiet; then
            git -c user.name='Tinkers21 port automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'port: move verified NeoForge imports'
            git push origin HEAD:port/1.21.1-neoforge
          fi

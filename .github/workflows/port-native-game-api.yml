name: Inspect pinned event registry provider ownership APIs
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/port-native-game-api.yml]
permissions:
  contents: read
jobs:
  native_api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: '**/*.gradle*'
      - name: Resolve pinned public Minecraft artifacts
        run: ./gradlew :createMinecraftArtifacts --no-daemon --console=plain
      - name: Inspect pinned registry provider APIs and ownership
        shell: python
        run: |
          import subprocess
          jar = 'build/moddev/artifacts/neoforge-21.1.251.jar'
          classes = (
              'net.neoforged.neoforge.data.event.GatherDataEvent',
              'net.neoforged.neoforge.common.data.DatapackBuiltinEntriesProvider',
              'net.neoforged.neoforge.data.loading.DatagenModLoader',
              'net.minecraft.resources.RegistryOps',
              'net.minecraft.data.registries.VanillaRegistries',
          )
          terms = ('getLookupProvider(', 'getRegistryProvider(', 'createDatapack', 'setRegistries',
                   'registriesWithModdedEntries', 'createLookup(', 'withParent(', 'newDataGenerator(')
          for cls in classes:
              result = subprocess.run(['javap', '-c', '-p', '-classpath', jar, cls],
                                      capture_output=True, text=True)
              print('Class', cls, 'status', result.returncode)
              if result.returncode:
                  print(result.stderr[:300])
                  continue
              lines = result.stdout.splitlines()
              selected = set()
              for i, line in enumerate(lines):
                  if any(term in line for term in terms):
                      selected.update(range(max(0, i-3), min(len(lines), i+35)))
              for i in sorted(selected):
                  print(lines[i])

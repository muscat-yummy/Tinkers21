name: Inspect native container close ordering and game test assertions
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/port-native-game-api.yml]
permissions:
  contents: read
jobs:
  native_api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: '**/*.gradle*'
      - name: Resolve pinned public Minecraft artifacts
        run: ./gradlew :createMinecraftArtifacts --no-daemon --console=plain
      - name: Inspect actual close packet control flow
        shell: python
        run: |
          import subprocess
          result = subprocess.run(['javap', '-c', '-classpath', 'build/moddev/artifacts/neoforge-21.1.251.jar', 'net.minecraft.server.network.ServerGamePacketListenerImpl'], check=True, capture_output=True, text=True)
          lines = result.stdout.splitlines()
          start = next(i for i, line in enumerate(lines) if 'void handleContainerClose(' in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].startswith('  public '))
          print('\n'.join(lines[start:end]))
      - name: Inspect native world test and block persistence APIs
        run: javap -classpath build/moddev/artifacts/neoforge-21.1.251.jar net.minecraft.gametest.framework.GameTestHelper net.minecraft.world.level.block.entity.BlockEntity

name: Inspect pinned item predicate holder construction
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/port-native-game-api.yml]
permissions:
  contents: read
jobs:
  native_api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: '**/*.gradle*'
      - name: Resolve pinned public Minecraft artifacts
        run: ./gradlew :createMinecraftArtifacts --no-daemon --console=plain
      - name: Inspect native data generator registry provider creation
        shell: python
        run: |
          import subprocess
          jar = 'build/moddev/artifacts/neoforge-21.1.251.jar'
          for cls in ('net.neoforged.neoforge.data.event.GatherDataEvent', 'net.neoforged.neoforge.data.event.GatherDataEvent$DataGeneratorConfig',
                      'net.neoforged.neoforge.data.loading.DatagenModLoader', 'net.minecraft.data.registries.VanillaRegistries',
                      'net.minecraft.data.recipes.RecipeProvider', 'net.minecraft.data.recipes.RecipeProvider$1',
                      'net.minecraft.data.advancements.AdvancementProvider', 'net.minecraft.advancements.critereon.ItemPredicate$Builder',
                      'net.minecraft.advancements.critereon.InventoryChangeTrigger$TriggerInstance',
                      'net.minecraft.advancements.Criterion', 'net.minecraft.advancements.Advancement'):
              p = subprocess.run(['javap', '-c', '-p', '-classpath', jar, cls], capture_output=True, text=True, check=False)
              if p.returncode:
                  print('Unavailable native class', cls)
                  continue
              lines = p.stdout.splitlines()
              print('Class', cls)
              for i, line in enumerate(lines):
                  if any(term in line for term in (' of(', 'hasItems(', ' item(', 'criteria(', 'public net.minecraft.advancements.Advancement(', 'public net.minecraft.advancements.Criterion(', 'triggerInstance(', 'getLookupProvider(')):
                      print('\n'.join(lines[i:i+135]))

name: Inspect native world creation and armor render entry points
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/port-native-game-api.yml]
permissions:
  contents: read
jobs:
  native_api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: '**/*.gradle*'
      - name: Resolve pinned public Minecraft artifacts
        run: ./gradlew :createMinecraftArtifacts --no-daemon --console=plain
      - name: Inspect public native APIs only
        run: javap -classpath build/moddev/artifacts/neoforge-21.1.251.jar net.neoforged.neoforge.client.extensions.common.IClientItemExtensions net.minecraft.client.model.HumanoidModel net.minecraft.client.model.geom.ModelLayers net.minecraft.client.CameraType
      - name: Inspect actual native fresh-world control flow
        run: javap -c -classpath build/moddev/artifacts/neoforge-21.1.251.jar net.minecraft.client.gui.screens.worldselection.WorldOpenFlows

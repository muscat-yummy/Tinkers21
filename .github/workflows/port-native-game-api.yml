name: Verify native stack persistence and discarded result audit
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/port-native-game-api.yml]
permissions:
  contents: read
jobs:
  native_api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: '**/*.gradle*'
      - name: Resolve pinned public Minecraft artifacts
        run: ./gradlew :createMinecraftArtifacts --no-daemon --console=plain
      - name: Inspect pinned native item save implementation
        shell: python
        run: |
          import subprocess
          result = subprocess.run(['javap', '-c', '-classpath', 'build/moddev/artifacts/neoforge-21.1.251.jar', 'net.minecraft.world.item.ItemStack'], check=True, capture_output=True, text=True)
          lines = result.stdout.splitlines()
          starts = [i for i, line in enumerate(lines) if 'net.minecraft.nbt.Tag save(' in line]
          for start in starts:
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('  public ')), len(lines))
              print('\n'.join(lines[start:end]))
      - name: Audit discarded two-argument stack save calls
        shell: python
        run: |
          import pathlib, re
          pattern = re.compile(r'^\s*[A-Za-z_$][\w.$()]*\.save\([^;\n]+,\s*\w+\s*\);\s*$')
          matches = 0
          for root in ('src/main/java', 'mantle-port/src/main/java'):
              for path in pathlib.Path(root).rglob('*.java'):
                  for line_number, line in enumerate(path.read_text().splitlines(), 1):
                      if pattern.match(line):
                          print(f'Discarded native save result candidate: {path}:{line_number}')
                          matches += 1
          print(f'Discarded save candidate count: {matches}')

name: Inspect real datagen registry lookup composition APIs
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/port-native-game-api.yml]
permissions:
  contents: read
jobs:
  native_api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: '**/*.gradle*'
      - name: Resolve pinned public Minecraft artifacts
        run: ./gradlew :createMinecraftArtifacts --no-daemon --console=plain
      - name: Inspect native registry lookup composition signatures
        run: javap -classpath build/moddev/artifacts/neoforge-21.1.251.jar 'net.minecraft.core.HolderLookup$Provider' 'net.minecraft.core.HolderLookup$RegistryLookup' net.minecraft.core.RegistryAccess net.minecraft.core.registries.BuiltInRegistries net.minecraft.resources.RegistryOps net.minecraft.core.Registry

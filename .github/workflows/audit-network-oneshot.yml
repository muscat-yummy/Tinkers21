name: Audit network API use
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/audit-network-oneshot.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Summarize network usages
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          roots = (Path('src/main/java'), Path('mantle-port/src/main/java'))
          for root in roots:
              methods = Counter()
              distributors = Counter()
              channels = Counter()
              files = 0
              for path in root.rglob('*.java'):
                  data = path.read_text(encoding='utf-8')
                  if 'net.minecraftforge.network' not in data and 'NetworkEvent.Context' not in data:
                      continue
                  files += 1
                  if 'NetworkEvent.Context' in data or 'NetworkEvent' in data:
                      methods.update(re.findall(r'\b(?:context|ctx|supplier\.get\(\))\.([A-Za-z_]\w*)\s*\(', data))
                  distributors.update(re.findall(r'PacketDistributor\.([A-Z_]+)', data))
                  channels.update(re.findall(r'\bnetwork\.([A-Za-z_]\w*)\s*\(', data))
              print(root, 'files=', files)
              print('context methods', methods.most_common())
              print('packet distributors', distributors.most_common())
              print('channel calls', channels.most_common())
          PY

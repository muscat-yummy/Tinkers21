name: Apply entrypoint migration

on:
  push:
    branches:
      - port/1.21.1-neoforge
    paths:
      - .github/workflows/migrate-entrypoint.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adapt entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/migrate_entrypoint.py
          git add src/main/java/slimeknights/tconstruct/TConstruct.java
          git -c user.name='Tinkers21 port automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'port: inject NeoForge mod bus in TiC entrypoint'
          git push origin HEAD:port/1.21.1-neoforge

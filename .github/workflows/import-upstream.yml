name: Import pinned upstream source and compile once

on:
  push:
    branches:
      - port/1.21.1-neoforge
    paths:
      - .github/workflows/import-upstream.yml

permissions:
  contents: write

jobs:
  import-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out port branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check out pinned TiC 1.20.1 source
        uses: actions/checkout@v4
        with:
          repository: SlimeKnights/TinkersConstruct
          ref: 2785bc3b5e7777f9f1fd77a243887171ea2c3c68
          path: upstream
          persist-credentials: false

      - name: Import source, resources and original development metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "2785bc3b5e7777f9f1fd77a243887171ea2c3c68"
          test ! -e src/main/java/slimeknights/tconstruct/TConstruct.java
          mkdir -p src
          cp -a upstream/src/. src/
          cp upstream/lombok.config lombok.config
          cp upstream/.editorconfig .editorconfig
          git add src lombok.config .editorconfig
          git -c user.name='Tinkers21 port automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'port: import pinned TiC 1.20.1 sources and resources'
          git push origin HEAD:port/1.21.1-neoforge
          rm -rf upstream

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile once to identify migration failures
        shell: bash
        run: |
          set -o pipefail
          ./gradlew compileJava --no-daemon --max-workers=2 2>&1 | tee compile.log

      - name: Save compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-compile-log
          path: compile.log
          if-no-files-found: ignore

name: Migrate network imports and registration
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/migrate-network-oneshot.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply network migration
        run: |
          set -euo pipefail
          python3 scripts/migrate_verified_imports.py --root mantle-port
          python3 scripts/migrate_verified_imports.py --root tconstruct
          python3 scripts/migrate_network_initialization.py
          git add mantle-port/src/main/java src/main/java
          git -c user.name='Tinkers21 port automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'port: bind legacy packets to NeoForge payload registration'
          git push origin HEAD:port/1.21.1-neoforge

name: Check phase 1 build environment
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/check-phase1-oneshot.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Mantle compile classpath and compiler
        run: |
          set +e
          ./gradlew :mantle-port:compileJava --no-daemon --console=plain > /tmp/phase1-compile.log 2>&1
          code=$?
          set -e
          tail -60 /tmp/phase1-compile.log
          if grep -Eq 'Could not resolve|Could not find mezz.jei|Could not get resource' /tmp/phase1-compile.log; then
            exit 1
          fi
          if [ "$code" -ne 0 ] && ! grep -q ' error: ' /tmp/phase1-compile.log; then
            exit 1
          fi

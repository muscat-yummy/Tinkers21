name: Check phase 1 build environment
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/check-phase1-oneshot.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve module compile classpaths
        run: |
          ./gradlew :mantle-port:dependencies :dependencies --configuration compileClasspath --no-daemon --console=plain > /tmp/phase1-dependencies.log
          grep -E 'jei-1.21.1-(common|neoforge)-api|project :mantle-port|net.neoforged:neoforge' /tmp/phase1-dependencies.log | head -25
      - name: Confirm Java compiler checkpoint
        run: |
          set +e
          ./gradlew :mantle-port:compileJava --no-daemon --console=plain > /tmp/phase1-compile.log 2>&1
          code=$?
          set -e
          grep -E '(^> Task :mantle-port:compileJava|[0-9,]+ errors$|BUILD FAILED|BUILD SUCCESSFUL)' /tmp/phase1-compile.log | tail -10
          if [ "$code" -ne 0 ] && ! grep -q '^> Task :mantle-port:compileJava' /tmp/phase1-compile.log; then
            tail -80 /tmp/phase1-compile.log
            exit 1
          fi

name: Migrate ResourceLocation factories

on:
  push:
    branches:
      - port/1.21.1-neoforge
    paths:
      - .github/workflows/migrate-resourcelocation.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply constrained constructor rewrite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/migrate_resource_locations.py
          git add src/main/java
          if git diff --cached --quiet; then
            echo 'No source changes'
            exit 0
          fi
          git -c user.name='Tinkers21 port automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'port: migrate simple ResourceLocation constructors'
          git push origin HEAD:port/1.21.1-neoforge

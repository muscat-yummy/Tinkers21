name: Migrate recipe outputs and compile Mantle
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/port-recipe-consumers-oneshot.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Move remaining builders and providers to registry-aware outputs
        shell: python
        run: |
          from pathlib import Path
          import re
          changed = set()
          old = 'import net.minecraft.data.recipes.FinishedRecipe;'
          new = 'import slimeknights.mantle.recipe.data.FinishedRecipe;\nimport slimeknights.mantle.recipe.data.RecipeConsumer;'
          for root in (Path('src/main/java'), Path('mantle-port/src/main/java')):
              for path in root.rglob('*.java'):
                  source = path.read_text()
                  if old in source:
                      source = source.replace(old, new).replace('Consumer<FinishedRecipe>', 'RecipeConsumer')
                      path.write_text(source)
                      changed.add(str(path))
          providers = list(Path('src/main/java/slimeknights/tconstruct').rglob('*RecipeProvider.java'))
          assert len(providers) == 9, len(providers)
          for path in providers:
              source = path.read_text()
              source, count = re.subn(r'public (\w+RecipeProvider)\(PackOutput (\w+)\) \{\n    super\(\2\);',
                  r'public \1(PackOutput \2, java.util.concurrent.CompletableFuture<net.minecraft.core.HolderLookup.Provider> registries) {\n    super(\2, registries);', source)
              assert count == 1, str(path)
              if path.name == 'BaseRecipeProvider.java':
                  source = source.replace('import net.minecraft.data.recipes.RecipeProvider;', 'import slimeknights.mantle.recipe.data.MantleRecipeProvider;')
                  source = source.replace('extends RecipeProvider', 'extends MantleRecipeProvider')
                  source = source.replace('net.minecraftforge.common.crafting.conditions.IConditionBuilder', 'net.neoforged.neoforge.common.conditions.IConditionBuilder')
              path.write_text(source)
              changed.add(str(path))
          replacements = {
            'shared/TinkerCommons.java': [('new CommonRecipeProvider(output)', 'new CommonRecipeProvider(output, event.getLookupProvider())')],
            'gadgets/TinkerGadgets.java': [('new GadgetRecipeProvider(generator.getPackOutput())', 'new GadgetRecipeProvider(generator.getPackOutput(), event.getLookupProvider())')],
            'smeltery/TinkerSmeltery.java': [('new SmelteryRecipeProvider(packOutput)', 'new SmelteryRecipeProvider(packOutput, event.getLookupProvider())')],
            'tables/TinkerTables.java': [('new TableRecipeProvider(generator.getPackOutput())', 'new TableRecipeProvider(generator.getPackOutput(), event.getLookupProvider())')],
            'tools/TinkerTools.java': [('new ToolsRecipeProvider(packOutput)', 'new ToolsRecipeProvider(packOutput, event.getLookupProvider())'), ('new MaterialRecipeProvider(packOutput)', 'new MaterialRecipeProvider(packOutput, event.getLookupProvider())')],
            'tools/TinkerModifiers.java': [('new ModifierRecipeProvider(packOutput)', 'new ModifierRecipeProvider(packOutput, event.getLookupProvider())')],
            'world/TinkerWorld.java': [('new WorldRecipeProvider(packOutput)', 'new WorldRecipeProvider(packOutput, event.getLookupProvider())')],
          }
          for relative, pairs in replacements.items():
              path = Path('src/main/java/slimeknights/tconstruct') / relative
              source = path.read_text()
              for old, new in pairs:
                  assert source.count(old) == 1, str(path)
                  source = source.replace(old, new)
              path.write_text(source)
              changed.add(str(path))
          print('Migrated files:', len(changed))
          for path in sorted(changed):
              print(path)
      - name: Save mechanical migration on the port branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java mantle-port/src/main/java
          if ! git diff --cached --quiet; then
            git commit -m "Move recipe builders and providers to registry-aware Mantle output"
            git push origin HEAD:refs/heads/port/1.21.1-neoforge
          fi
      - name: Compile Mantle with expanded diagnostics
        run: |
          cat > /tmp/tinkers-compiler.init.gradle <<'GRADLE'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.compilerArgs.addAll(['-Xmaxerrs', '2200'])
              }
          }
          GRADLE
          ./gradlew :mantle-port:compileJava --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle

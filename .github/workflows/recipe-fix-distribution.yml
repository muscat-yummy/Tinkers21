name: Verify recipe fix production distribution
on:
  push:
    branches: [fix/recipe-viewer]
    paths:
      - '.github/workflows/recipe-fix-distribution.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  minecraft_client:
    needs: minecraft_load
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: '**/*.gradle*'
      - name: Retain the successful strict native client without optional viewers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import json, os, subprocess
          source='ff002799194b4a9288fa36d25c580fb4a8e86a40'
          jobs=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/38165225689/jobs'],text=True))['jobs']
          job=next(j for j in jobs if j['id']==114546962547)
          assert any(s['name']=='Require graphical client verification' and s['conclusion']=='success' for s in job['steps'])
          subprocess.run(['git','fetch','--no-tags','origin',source],check=True)
          subprocess.run(['git','diff','--exit-code',source,'HEAD','--','src/main','src/generated','mantle-port','gradle.properties','build.gradle','settings.gradle','gradle','gradlew','gradlew.bat','src/portClientCheck','src/portAddonCheck',
              ':(exclude)src/main/java/slimeknights/tconstruct/mixin/EmiScrollGridWidgetMixin.java',
              ':(exclude)src/main/java/slimeknights/tconstruct/mixin/EmiRecipeIdentityMixin.java'],check=True)
          print('Strict native client without JEI/EMI retained from successful steps in job 114546962547; changed optional EMI targets are absent in this profile')
      - name: Require the accepted actual viewer audit and identical production source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import json, subprocess, time
          from pathlib import Path
          base='644bf6b8d517d1a411a4316ec18e9ccf93867afb'
          deadline=time.monotonic()+600
          while True:
              run=json.loads(subprocess.check_output(['gh','api','repos/'+__import__('os').environ['GITHUB_REPOSITORY']+'/actions/runs/38166095246'],text=True))
              assert run['head_sha']==base
              if run['status']=='completed': break
              assert time.monotonic()<deadline, 'Viewer audit did not finish'
              time.sleep(10)
          assert run['conclusion']=='success'
          subprocess.run(['git','fetch','--no-tags','origin',base],check=True)
          subprocess.run(['git','diff','--exit-code',base,'HEAD','--','src/main','src/generated','mantle-port','build.gradle','settings.gradle','gradle','gradlew','gradlew.bat','src/portAddonCheck',
              ':(exclude)src/main/templates/META-INF/neoforge.mods.toml',
              ':(exclude)mantle-port/src/main/templates/META-INF/neoforge.mods.toml',
              ':(exclude)mantle-port/build.gradle'],check=True)
          replacements={
              'gradle.properties':[('mod_version=3.12.1-port.7','mod_version=3.12.1-port.8')],
              'mantle-port/build.gradle':[("version = '1.11-port.4'","version = '1.11-port.5'")],
              'src/main/templates/META-INF/neoforge.mods.toml':[('[1.11-port.4,)','[1.11-port.5,)')],
              'mantle-port/src/main/templates/META-INF/neoforge.mods.toml':[('version="1.11-port.4"','version="1.11-port.5"')],
          }
          for path,pairs in replacements.items():
              expected=subprocess.check_output(['git','show',base+':'+path],text=True)
              for old,new in pairs: expected=expected.replace(old,new)
              assert Path(path).read_text()==expected,path
      - name: Assemble production distribution jars
        run: ./gradlew :assemble :mantle-port:assemble --no-daemon --console=plain
      - name: Inspect and package actual hotfix jars
        env:
          TINKERS21_RELEASE_VERSION: '3.12.1-port.8'
          RECIPE_AUDIT_RUN: '38166095246'
          RECIPE_AUDIT_SHA: '644bf6b8d517d1a411a4316ec18e9ccf93867afb'
        run: python3 scripts/release/package_preview.py
      - name: Verify identical 251-compiled distribution jars on installed NeoForge 249 and 251 servers
        run: |
          set -euo pipefail
          for version in 21.1.249 21.1.251; do
            mkdir -p release-server
            curl --fail --location --retry 2 "https://maven.neoforged.net/releases/net/neoforged/neoforge/$version/neoforge-$version-installer.jar" -o release-server/installer.jar
            (cd release-server && timeout 240s java -jar installer.jar --installServer)
            python3 scripts/release/check_installed_server.py
            mv release-server "release-server-$version"
          done
      - name: Keep installed-server diagnostics
        if: always()
        shell: python
        run: |
          from pathlib import Path
          for path in sorted(Path('.').glob('release-server*/console.log')) + sorted(Path('.').glob('release-server*/logs/latest.log')):
              if path.is_file():
                  print(path.read_text(errors='replace')[-60000:])
      - uses: actions/upload-artifact@v4
        with:
          name: Tinkers21-3.12.1-port.8-distribution
          path: |
            dist/*
            build/release-evidence/*
            docs/releases/3.12.1-port.8.md
            release-server*/logs/latest.log
            run-port-client-check/logs/latest.log
            run-port-client-check/*gui*.png
          if-no-files-found: error
          retention-days: 30
  minecraft_load:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retain the successful 28 native GameTests for identical server source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import json, os, subprocess
          source='ff002799194b4a9288fa36d25c580fb4a8e86a40'
          jobs=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/38165225689/jobs'],text=True))['jobs']
          assert any(j['id']==114546284188 and j['conclusion']=='success' for j in jobs)
          subprocess.run(['git','fetch','--no-tags','origin',source],check=True)
          subprocess.run(['git','diff','--exit-code',source,'HEAD','--','src/main','src/generated','mantle-port','gradle.properties','build.gradle','settings.gradle','gradle','gradlew','gradlew.bat','src/portGameTest','src/portAddonCheck',
              ':(exclude)src/main/java/slimeknights/tconstruct/mixin/EmiScrollGridWidgetMixin.java',
              ':(exclude)src/main/java/slimeknights/tconstruct/mixin/EmiRecipeIdentityMixin.java'],check=True)
          config=json.loads(__import__('pathlib').Path('src/main/resources/tconstruct.mixins.json').read_text())
          assert all(m in config['client'] and m not in config['mixins'] for m in ['EmiScrollGridWidgetMixin','EmiRecipeIdentityMixin'])
          print('All 28 actual Minecraft GameTests retained at 38165225689 / ff002799; only optional client scroll-grid positioning and display identities changed')

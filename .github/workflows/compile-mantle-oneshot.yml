name: Compile Mantle port checkpoint
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/compile-mantle-oneshot.yml]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Mantle module
        run: ./gradlew :mantle-port:compileJava --no-daemon --console=plain

name: Audit external Java imports
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/audit-external-imports-oneshot.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Summarize external import roots
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          for root in (Path('mantle-port/src/main/java'), Path('src/main/java')):
              counts = Counter()
              examples = {}
              for path in root.rglob('*.java'):
                  for name in re.findall(r'^import\s+(?:static\s+)?([\w.]+);', path.read_text(encoding='utf-8'), re.M):
                      if name.startswith(('java.', 'javax.', 'net.minecraft.', 'net.neoforged.', 'net.minecraftforge.', 'slimeknights.', 'com.mojang.', 'org.jetbrains.', 'org.apache.', 'it.unimi.', 'com.google.', 'lombok.')):
                          continue
                      prefix = '.'.join(name.split('.')[:3])
                      counts[prefix] += 1
                      examples.setdefault(prefix, name)
              print(root, 'Java files:', len(list(root.rglob('*.java'))))
              for prefix, count in counts.most_common():
                  print(count, prefix, examples[prefix])
          PY

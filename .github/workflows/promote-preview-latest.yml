name: Mark verified preview as Latest
on:
  push:
    branches: [main]
    paths: [.github/workflows/promote-preview-latest.yml]
permissions:
  contents: write
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Promote existing release without rebuilding or replacing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/v3.12.1-port.0" > /tmp/release-before.json
          python3 - <<'PY'
          import json
          r = json.load(open('/tmp/release-before.json'))
          assert r['id'] == 409421343 and not r['draft']
          assert r['target_commitish'] == '7a0ff7713da705adcee5bf5dd4dd39c8ae000b6d'
          assert len(r['assets']) == 6
          assert 'experimental' in r['body']
          PY
          gh release edit v3.12.1-port.0 --repo "$GH_REPO" --prerelease=false --latest
          gh api "repos/$GH_REPO/releases/latest" > /tmp/release-after.json
          python3 - <<'PY'
          import json
          before = json.load(open('/tmp/release-before.json'))
          after = json.load(open('/tmp/release-after.json'))
          assert after['id'] == before['id'] and after['tag_name'] == before['tag_name']
          assert not after['draft'] and not after['prerelease']
          for key in ['body', 'target_commitish', 'name']:
              assert after[key] == before[key], key
          def assets(r):
              return sorted((a['id'], a['name'], a['size'], a['digest']) for a in r['assets'])
          assert assets(before) == assets(after)
          print('Existing release Latest promotion PASS; source, notes and all asset digests unchanged')
          print(after['html_url'])
          PY

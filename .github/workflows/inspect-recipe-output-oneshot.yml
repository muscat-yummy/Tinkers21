name: Inspect vanilla 1.21.1 recipe output APIs
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/inspect-recipe-output-oneshot.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve mapped Minecraft artifacts
        run: ./gradlew :mantle-port:createMinecraftArtifacts --no-daemon --console=plain
      - name: Inspect selected vanilla API signatures
        shell: python
        run: |
          import os, pathlib, subprocess, zipfile
          targets = {
            'net.minecraft.data.recipes.RecipeProvider': ('RecipeProvider(', 'run(', 'buildRecipes(', 'createRootAdvancement(', 'has('),
            'net.minecraft.data.recipes.RecipeOutput': ('accept(', 'advancement('),
            'net.minecraft.advancements.Advancement': ('CODEC',),
            'net.minecraft.advancements.Advancement$Builder': ('getCriteria(', 'addCriterion(', 'requirements(', 'build(', 'criteria'),
            'net.minecraft.world.item.crafting.ShapedRecipePattern': ('of(', 'data(', 'Data(', 'ingredients(',),
            'net.minecraft.world.item.crafting.Ingredient': ('of(', 'fromValues(', 'Ingredient(', 'Value', 'CODEC'),
            'net.minecraft.world.item.TieredItem': ('getTier(',),
            'net.minecraft.util.datafix.DataFixers': ('getDataFixer(',),
          }
          pending = dict(targets)
          roots = [pathlib.Path(os.environ['HOME']) / '.gradle' / 'caches', pathlib.Path('mantle-port/build')]
          for root in roots:
            for jar in root.rglob('*.jar'):
              if not pending:
                break
              try:
                with zipfile.ZipFile(jar) as archive:
                  names = set(archive.namelist())
              except (OSError, zipfile.BadZipFile):
                continue
              for cls, wanted in list(pending.items()):
                if cls.replace('.', '/') + '.class' not in names:
                  continue
                result = subprocess.run(['javap', '-classpath', str(jar), '-p', cls], capture_output=True, text=True, check=True)
                print('Vanilla API:', cls)
                selected = False
                for line in result.stdout.splitlines():
                  if any(token in line for token in wanted):
                    print(line)
                del pending[cls]
          if pending:
            raise RuntimeError('Mapped vanilla classes not found: ' + ', '.join(pending))

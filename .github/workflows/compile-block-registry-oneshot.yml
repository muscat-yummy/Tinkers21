name: Compile Mantle block registration checkpoint
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/compile-block-registry-oneshot.yml]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Mantle
        run: |
          cat > /tmp/tinkers-compiler.init.gradle <<'GRADLE'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.compilerArgs.addAll(['-Xmaxerrs', '2200'])
              }
          }
          GRADLE
          ./gradlew :mantle-port:compileJava --no-daemon --console=plain -I /tmp/tinkers-compiler.init.gradle
      - name: Inspect remaining loader and fluid API signatures
        if: always()
        shell: python
        run: |
          import os, pathlib, subprocess, zipfile
          targets = {
            'net.neoforged.fml.ModLoader': ('hasErrors(', 'getErrors(', 'getLoading', 'isLoading', 'get(',),
            'net.neoforged.neoforge.fluids.FluidStack': ('FluidStack(', 'CODEC', 'STREAM_CODEC', 'getComponents', 'applyComponents',),
            'net.minecraft.resources.RegistryOps': ('getter(', 'lookup(', 'retrieveGetter(',),
            'net.minecraft.world.level.material.FlowingFluid': ('sourceNeighborCount(', 'spreadToSides(', 'affectsFlow(', 'canPassThrough', 'isSourceBlockOfThisType(', 'getCacheKey(', 'canHoldFluid(', 'isWaterHole(',),
            'net.minecraft.world.level.Level': ('potionBrewing(',),
            'net.minecraft.client.multiplayer.ClientLevel': ('potionBrewing(',),
          }
          pending = dict(targets)
          roots = [pathlib.Path(os.environ['HOME']) / '.gradle' / 'caches', pathlib.Path('mantle-port/build')]
          for root in roots:
            for jar in root.rglob('*.jar'):
              if not pending:
                break
              try:
                with zipfile.ZipFile(jar) as archive:
                  names = set(archive.namelist())
              except (OSError, zipfile.BadZipFile):
                continue
              for cls, wanted in list(pending.items()):
                if cls.replace('.', '/') + '.class' not in names:
                  continue
                result = subprocess.run(['javap', '-classpath', str(jar), '-p', cls], capture_output=True, text=True, check=True)
                print('Vanilla API:', cls)
                selected = False
                for line in result.stdout.splitlines():
                  if any(token in line for token in wanted):
                    print(line)
                del pending[cls]
          if pending:
            raise RuntimeError('Mapped vanilla classes not found: ' + ', '.join(pending))

name: Compile and load the actual TiC port in Minecraft
on:
  push:
    branches: [port/1.21.1-neoforge]
    paths: [.github/workflows/port-game-load.yml]
permissions:
  contents: read
jobs:
  minecraft_load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: '**/*.gradle*'
      - name: Create the isolated native world fixture
        run: python3 scripts/port/create_game_load_template.py
      - name: Build full production sources and run the actual Minecraft GameTest server
        run: timeout 600s ./gradlew :build :runPortGameTestServer -PportGameTests=true --no-daemon --console=plain
      - name: Show actual game diagnostics
        if: always()
        shell: python
        run: |
          import pathlib
          log = pathlib.Path('run-port-game-test/logs/latest.log')
          if log.is_file():
              print(log.read_text()[-90000:])
          for crash in sorted(pathlib.Path('run-port-game-test/crash-reports').glob('*.txt')):
              print(crash.read_text()[-90000:])

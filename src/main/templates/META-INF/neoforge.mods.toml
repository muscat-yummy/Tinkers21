modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/muscat-yummy/Tinkers21/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
enumExtensions="META-INF/enumextensions.json"
description='''Unofficial port of Tinkers' Construct to Minecraft 1.21.1.'''

[[dependencies.tconstruct]]
modId="neoforge"
type="required"
versionRange="[21.1.249,)"
ordering="NONE"
side="BOTH"

[[dependencies.tconstruct]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tconstruct]]
modId="mantle"
type="required"
versionRange="[1.11-port.4,)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="tconstruct.mixins.json"

# Scoped ingredient visibility is required when optional JEI integration is enabled.
[[dependencies.tconstruct]]
modId="jei"
type="optional"
versionRange="[19.51.0,20)"
ordering="AFTER"
side="CLIENT"
